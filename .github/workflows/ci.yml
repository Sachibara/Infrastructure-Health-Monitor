name: Infrastructure Health Monitor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Check Python syntax
        run: python -m py_compile backend/health_api.py

      - name: Smoke test backend
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("backend/health_api.py")
          spec = importlib.util.spec_from_file_location("health_api", path)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)

          module.init_db()
          payload = module.bootstrap()
          assert payload["hosts"]
          assert payload["services"]
          assert "alerts" in payload
          assert "samples" in payload
          cpu, memory, disk, uptime = module.local_telemetry()
          assert 0 <= cpu <= 100
          assert 0 <= memory <= 100
          assert 0 <= disk <= 100
          assert uptime >= 0
          print("Infrastructure Health Monitor backend smoke test passed")
          PY

      - name: Validate consolidation redirect
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")
          destination = "https://sachibara.github.io/NetOps-Command-Center/"

          assert destination in html, "Redirect destination missing from index.html"
          assert 'http-equiv="refresh"' in html, "Redirect meta tag missing"
          assert 'rel="canonical"' in html, "Canonical link missing"
          assert destination in readme, "README consolidation destination missing"
          assert readme.startswith("> **Consolidated module:**"), "README consolidation notice missing"
          print("Consolidation redirect validation passed")
          PY

      - name: Validate JSON
        run: python -m json.tool vercel.json > /dev/null
